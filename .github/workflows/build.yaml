name: "Build"

on:
  push:
    branches: ["proton-new"]

jobs:
  build-kernel:
    runs-on: ubuntu-26.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - model: exynos2100
            branch: 1Lama_Up
            variant: KSU
    
    steps:
         - run: echo ${{vars.CHAT_ID}}

  building:
    runs-on: ubuntu-latest
    steps:
         - uses: actions/checkout@v4
    
         - run: export WP="$(realpath $PWD/../)"; bash build/ckbuild_actions.sh -tkR
    
         - name: Upload
           uses: actions/upload-artifact@v4
           with:
            name: $ZIP_PATH
            path: $ZIP_PATH

         - run: export WP="$(realpath $PWD/../)"; bash build/ckbuild_actions.sh -tR

         - name: Upload
           uses: actions/upload-artifact@v4
           with:
            name: $ZIP_PATH
            path: $ZIP_PATH
